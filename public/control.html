<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/control.css">
    <meta charset="utf-8">
    <title>Race Control</title>
</head>


<body>
    <div class="header-row">
        <h1>Race Controller</h1>
        <p id="status">Not connected</p>
    </div>
    <form id="login" class="password">
        <input id="key" type="password" placeholder="Controller key" required>
        <button>Connect</button>
    </form>

    <div id="main" class = "hidden">
        <div id="trackMode" class="buttons">
            <p>Track Mode</p>
            <button id="safe">🟢</button>
            <button id="hazard">🟡</button>
            <button id="danger">🔴</button>
            <button id="finish">🏁</button>

        </div>
        <p id="currentFlag">finished</p>
    </div>

    <div id="current-session" class = "hidden">
        <template id="session-card-template">
            <article class="session-card">
                <header class="session-card-header">
                    <div class="session-title-row">
                        <h3>No sessions</h3>
                    </div>
                    <p>0 / 8 drivers</p>
                </header>

                <table class="driver-table">
                    <thead>
                        <tr>
                            <th scope="col">Driver</th>
                            <th scope="col">Car</th>
                            <th scope="col">Pit</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td></td>
                            <td></td>
                            <td>
                                <!-- checkbox -->
                                <input type="checkbox" class="pit-return-check">
                                    
                            </td>
                        </tr>
                        
                    </tbody>
                </table>
            </article>
        </template>
    </div>




    <div id="session-control-btns" class = "hidden">
        <button id="start-session" class = "control-btn">START</button>
        <button id="finish-session" class = "control-btn">FINISH</button>
        <button id="end-session" class = "control-btn">END</button>
    </div>
    













<script src="/socket.io/socket.io.js"></script>
<script src="/js/control.js"></script>
</body>
</html>
