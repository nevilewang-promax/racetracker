<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line tracker</title>
    <link rel="stylesheet" href="/css/tracker.css">
</head>
<body>
    <h1>Lap line observer</h1>
    <form id="loginTracker" class="">
        <input id="key" type="password" placeholder="Race Observer key" required>
        <button>Connect</button>
    </form>
    <p id="statusTracker">Not connected</p>    
    <p class="race-mode"></p>    
    <div id="main-tracker" class="hidden">
        <div class="race-status"></div>
        <div class="container">
            <div class="orientation"></div>
        </div>
    </div>

</body>



   <script src="/socket.io/socket.io.js"></script>
   <script> 
        //-----------------------page setup---------------------------------------
        const socket = io({ autoConnect: false })
        const status = document.getElementById("statusTracker")

        document.getElementById("loginTracker").addEventListener("submit", (event) => {
                event.preventDefault()
                socket.auth = {
                    interface: "lap-line-tracker",
                    accessKey: document.getElementById("key").value
                }
                socket.connect()
        })        

        socket.on('connect', () => {
            document.getElementById('loginTracker').classList.add('hidden')
            document.getElementById('main-tracker').classList.remove('hidden')
            status.innerHTML = "connected"
        })        

        
        const orientation = document.querySelector(".orientation")
        const raceMode = document.querySelector(".race-mode")
        let countDown = {}    
        const flags = []   

        //-----------------------ongoing race---------------------------------------

        socket.on('race-ongoing', (activeRace)=>{
            if (activeRace === null) {
                status.innerHTML = "no ongoing race"
                return
            }

            let latestFlag = flags[flags.length-1]
            activeRace.countdown = countDown

            activeRace.entries.forEach((entry) => {
                const button = document.createElement("button")
                button.innerHTML = entry.carNumber
                button.classList.add("cars")
                orientation.appendChild(button)

                button.addEventListener("click", ()=> {
                    let carObj = activeRace.entries[entry.carNumber-1]

                    if (carObj.times === null || carObj.times === undefined) {
                        carObj.times = [{"min": 9, "sec": 60}];
                    }
                    
                    carObj.laptime = [];
                    carObj.times.push(countDown);

                    for(let i=1; i<carObj.times.length; i++) {
                       carObj.laptime.push({
                            "min": carObj.times[i-1].min-carObj.times[i].min, 
                            "sec" : carObj.times[i-1].sec-carObj.times[i].sec
                        })
                    }
                    
                    socket.emit('laptime-added', activeRace)
                })
            });
            status.innerHTML = "Race session is " + activeRace.status
        })
        
        //-----------------------ended race---------------------------------------        
        socket.on('session-ended', (ended)=> {
            if (ended) {
                document.querySelector("#main-tracker").remove()
                raceMode.remove()
                status.innerHTML = "Race session is ended"
            }
        })

        //track countdown
        socket.on('countdown-started', (index, countdown)=>{
            countDown = countdown
        })   
        
        //track flag
        socket.on("race-flag:status", (snapshot)=>{
            const trackMode = snapshot.trackMode
            raceMode.innerHTML = "Race mode: " + trackMode
        })   
   

   </script>
</html>
