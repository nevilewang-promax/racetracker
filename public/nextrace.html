<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Race</title>
    <link rel="stylesheet" href="/css/nextrace.css">
</head>
<body>
    <div class="container-nextrace">
        <p class="connection-status">not connected</p>
        <div class="race">
            <h2 class="message"></h2>
            <ul class="current-race-details">

            </ul>
        </div>
    </div>

   <script src="/socket.io/socket.io.js"></script>
   <script> 
        const socket = io({ autoConnect: false })
        socket.auth = {
            interface: "next-race",
        }
        socket.connect()           

        const status = document.querySelector(".connection-status")
        const race = document.querySelector(".race")
        const message = document.querySelector(".message")
        const list = document.querySelector(".current-race-details")

        socket.on('connect', () => {
            status.innerHTML = "connected"
        })                

        //listen and display upcomming race until it starts
        socket.on('upcomming-race', (upcommingRace)=> {
            message.innerHTML = "Please Proceed to Paddock"
            updatePage(upcommingRace, list, message)
        })

        
        //display next race after upcomming race switched to ongoing
        socket.on("front-desk:state", (races)=>{
            message.innerHTML = "Next Race"
            const nextRace = selectUpcommingSession(races.sessions)
            updatePage(nextRace, list, message)          
        })             

        //helpers
        function updatePage(raceData, list, message) {
            if (raceData === null || raceData === undefined) {
                message.innerHTML = "No upcomming race"
                return
            }
            list.innerHTML = "";
            raceData.entries.forEach((driver) => {
                const item = document.createElement("li")
                item.classList.add("car-details")
                item.textContent = `${driver.name} ${driver.carNumber}`
                list.appendChild(item)
            })        
        }

        function selectUpcommingSession(races) {
            return races.find((race) => race.status === "upcoming");
        }               

    </script>
</body>
</html>
