<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/reception.css">
    <meta charset="utf-8">
    <title>Front Desk</title>
</head>
<body>
    <div class="header-row">
        <h1>Receptionist</h1>
        <p id="status">Not connected</p>
    </div>
    <form id="login" class="password">
        <input id="key" type="password" placeholder="Receptionist key" required>
        <button>Connect</button>
    </form>
    

    <div id="top-btn" class="hidden">
        <button id = "back-top" class="header-btn">↑ Back to Top</button>
        <!-- <button id="to-upcoming" class="header-btn">Upcoming Sessions</button> -->
        <button id="create-session" class="header-btn">+ Create Sessions</button>
    </div>
    
    <div id="session-list"  class="hidden">

        <template id="session-card-template">
            <article class="session-card">
                <header class="session-card-header">
                    <div class="session-title-row">
                        <h3>Session #1</h3>
                        <button type="button" class="btn-danger btn-delete-session"
                                aria-label="Delete session" title="Delete session">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/>
                            </svg>
                        </button>
                    </div>
                    <p>2 / 8 drivers</p>
                </header>

                <table class="driver-table">
                    <thead>
                        <tr>
                            <th scope="col">Driver</th>
                            <th scope="col">Car</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Alice</td>
                            <td>#1</td>
                            <td>
                                <button type="button" class="btn-secondary">Edit</button>
                                <button type="button" class="btn-danger">Remove</button>
                            </td>
                        </tr>
                        
                    </tbody>
                </table>

                <footer class="session-card-actions">
                    <button  type="button" class="btn-primary btn-add-driver">Add Driver</button>
                    <form class="add-driver-form hidden">
                        <label>
                            Add driver name
                            <input type="text" name="driverName" required>
                        </label>
                        <p class="add-driver-error" role="alert"></p>
                        <button type="submit" class="btn-secondary">Save</button>
                        <button type="button" class="btn-secondary btn-cancel-driver">Cancel</button>
                    </form>
                    
                </footer>
            </article>
        </template>
    </div>




    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/reception.js"></script>
</body>
</html>
