<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/reception.css">
    <meta charset="utf-8">
    <title>Socket.IO Test</title>
</head>
<body>
    <h1>Receptionist</h1>
    <form id="login" class="password">
        <input id="key" type="password" placeholder="Receptionist key" required>
        <button>Connect</button>
    </form>
    <p id="status">Not connected</p>
    
    <div id="session-list"  class="hidden">
        <template id="session-card-template">
            <article class="session-card">
                <header class="session-card-header">
                    <h3>Session #1</h3>
                    <p>2 / 8 drivers</p>
                </header>

                <table class="driver-table">
                    <thead>
                        <tr>
                            <th scope="col">Driver</th>
                            <th scope="col">Car</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Alice</td>
                            <td>#1</td>
                            <td>
                                <button type="button">Edit</button>
                                <button type="button">Remove</button>
                            </td>
                        </tr>
                        
                    </tbody>
                </table>

                <footer class="session-card-actions">
                    <button type="button">Add Driver</button>
                    <button type="button">Delete Session</button>
                </footer>
            </article>
        </template>
    </div>




    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ autoConnect: false })
        const status = document.getElementById("status")
        

        document.getElementById("login").addEventListener("submit", (event) => {
            event.preventDefault()
            socket.auth = {
                interface: "front-desk",
                accessKey: document.getElementById("key").value
            }
            socket.connect()
        })

        socket.on("server:welcome", (message) => {
            console.log(message)
            status.textContent= "connected"
            const check = document.querySelector(".password")
            const prevHidden = document.querySelector(".hidden")
            prevHidden.classList.remove("hidden")
            check.classList.add("hidden")
        })

        socket.on("connect_error", (error) => {
            status.textContent = error.data?.code ?? error.message
           
        })

        socket.on("disconnect", () => {
            status.textContent = "Disconnected"
           
        })


        const sessionList = document.getElementById("session-list")
        const cardTemplate = document.getElementById("session-card-template")

        socket.on("front-desk:state", ({ sessions }) => {
            sessionList.replaceChildren()

            if (sessions.length === 0) {
                sessionList.textContent = "No upcoming sessions"
                return
            }

            for (const session of sessions) {
                const card = cardTemplate.content.firstElementChild.cloneNode(true)

                card.querySelector("h3").textContent = `Session #${session.id}`
                card.querySelector(".session-card-header p").textContent =
                    `${session.entries.length} / 8 drivers`

                const tbody = card.querySelector("tbody")
                const rowTemplate = tbody.querySelector("tr")
                tbody.replaceChildren()

                for (const entry of session.entries) {
                    const row = rowTemplate.cloneNode(true)
                    row.cells[0].textContent = entry.name
                    row.cells[1].textContent = `#${entry.carNumber}`
                    tbody.append(row)
                }

                sessionList.append(card)
            }
        })

        function showResponse(response) {
            console.log(response)
        }

        // testButton.addEventListener("click", () => {

        //     // socket.emit("driver:edit", { sessionId: 1, name: "Alice", newName: "Max" }, showResponse)
        //     // socket.emit("driver:remove", { sessionId: 1, name: "Bob" }, showResponse)
        // })
    </script>
</body>
</html>
